# Smithery (https://smithery.ai) manifest for the Nahook MCP server.
#
# The MCP server is distributed as a subcommand of the `nahook` CLI
# binary — users install the binary via Homebrew, install.sh,
# `go install`, or by downloading from GitHub Releases (see README.md).
# Smithery does not fetch the binary itself; it just invokes
# `nahook mcp serve` once the user has `nahook` on their PATH.
#
# Submission to Smithery is gated on Nahook GA. Until then this file
# exists for discoverability and to make the eventual submission
# mechanical.

name: nahook-mcp
displayName: Nahook MCP
description: >-
  The official Model Context Protocol server for Nahook — trigger
  webhooks, inspect deliveries, retry failures, and manage endpoints
  from Claude Desktop, Cursor, Cline, Zed, and other MCP-compatible
  AI assistants.
homepage: https://docs.nahook.com/mcp
repository: https://github.com/getnahook/nahook-mcp
license: MIT
category: developer-tools
keywords:
  - webhooks
  - nahook
  - api
  - delivery
  - developer-tools
  - claude
  - cursor

# Tool surface Smithery displays on the listing card. Mirrors the table
# in README.md — keep in sync when adding/removing tools in
# getnahook/nahook-cli (internal/commands/mcp/).
tools:
  - name: whoami
    description: Local config sanity check — workspace, region, token id, expiry.
  - name: list_endpoints
    description: List every endpoint in the current workspace.
  - name: get_endpoint
    description: Fetch one endpoint by its public id (ep_xxx).
  - name: create_endpoint
    description: Create a new endpoint. Defaults to the workspace's default environment.
  - name: update_endpoint
    description: Partial patch — pause/resume, change URL, update description.
  - name: list_environments
    description: List every environment in the workspace.
  - name: list_deliveries
    description: Page through an endpoint's deliveries, newest first.
  - name: get_delivery
    description: Fetch one delivery by its public id (del_xxx). Optionally include the original payload.
  - name: list_attempts
    description: List every attempt against a delivery (useful for debugging failures).
  - name: retry_delivery
    description: Re-enqueue a failed or dead-lettered delivery.
  - name: trigger_event
    description: Fire an event by type — the backend fans it out to every subscriber.
  - name: send_to_endpoint
    description: Send a webhook directly to one endpoint.

# Invocation + config.
#
# The configSchema + commandFunction shape (as opposed to a flat
# command/args) is what lets Smithery prompt the user for optional
# config at install time. We only ask for one thing — the Nahook
# ingestion key — which is OPTIONAL because read tools work without it.
#
# The CLI login token lives in ~/.nahook/config.toml and is set out-of-
# band by running `nahook login` from a terminal. Users do that before
# installing the MCP via Smithery; the manifest doesn't need to prompt
# for it.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      nahookIngestionKey:
        type: string
        title: Nahook ingestion key (optional)
        description: >-
          Nahook ingestion key (nhk_...) used by the trigger_event and
          send_to_endpoint tools. Read tools (list_endpoints,
          get_delivery, etc.) work without it. Same key your Nahook
          SDKs use — copy it from your dashboard. Leave blank if you
          only need read access.
    additionalProperties: false
  commandFunction: |-
    (config) => {
      const env = {};
      if (config && config.nahookIngestionKey) {
        env.NAHOOK_INGESTION_KEY = config.nahookIngestionKey;
      }
      return {
        command: 'nahook',
        args: ['mcp', 'serve'],
        env,
      };
    }
  exampleConfig: {}
